server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A location with its own add_header inherits none from the server block, so
    # the security headers are repeated in each one below.
    # connect-src lists the quote and exchange-rate services the app calls from
    # the browser (Yahoo Finance goes through /api/yahoo/ below, so 'self');
    # worker-src covers the simulation workers.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; worker-src 'self'; connect-src 'self' https://api.twelvedata.com https://www.alphavantage.co https://www.bankofcanada.ca; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Vite puts a content hash in every asset name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp;
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        try_files $uri =404;
    }

    # Yahoo Finance quotes need no API key but send no CORS headers, so the
    # browser asks this server and it forwards the request. Only the chart
    # endpoint the app uses is open, and only for GET, so this is not a general
    # proxy. The resolver comes from the container's /etc/resolv.conf at start
    # (docker/40-yahoo-resolver.sh); resolving per request keeps nginx starting
    # without DNS and follows Yahoo's changing addresses. The [f] pattern makes
    # the include optional, so nginx still starts if the script did not run.
    include /tmp/nginx-resolver.con[f];
    location /api/yahoo/v8/finance/chart/ {
        limit_except GET { deny all; }
        set $yahoo query1.finance.yahoo.com;
        rewrite ^/api/yahoo(/.*)$ $1 break;
        proxy_pass https://$yahoo;
        proxy_ssl_server_name on;
        proxy_set_header Host $yahoo;
        # Identify the app honestly instead of passing on the visitor's browser
        # User-Agent: Yahoo throttles full browser strings from servers, and
        # nothing about the visitor needs to reach Yahoo.
        proxy_set_header User-Agent "RetireEh (+https://github.com/Kombatant/retire-eh-reloaded)";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html must always be re-checked so a new image is picked up after an update.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        try_files $uri $uri/ /index.html;
    }
}
