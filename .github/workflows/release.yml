name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create artifact archive
        run: |
          cd dist
          zip -r ../retire-eh-${{ github.ref_name }}.zip .
          cd ..
          test -s retire-eh-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: retire-eh-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Retire, Eh? ${{ github.ref_name }}
            
            ### Download
            
            Download `retire-eh-${{ github.ref_name }}.zip` and extract it to any static file server.
            
            ### Docker

            `ghcr.io/kombatant/retire-eh-reloaded` (tag `latest`, or this version without the leading `v`). See `docker-compose.yml`.
